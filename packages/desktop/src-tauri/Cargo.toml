[package]
name = "piko"
version = "0.1.0"
description = "piko desktop app: the piko SPA in a native window"
edition = "2021"
publish = false

[lib]
name = "piko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-shell = "2.6.0"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "test"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
